<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isyarat Kita - Penerjemah Bahasa Isyarat</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#6b7280;--pri:#2563eb;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1219;--card:#1a1f2b;--tx:#eef1f7;--mut:#9aa3b2;--pri:#5b8cff;--bd:#2b3242}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:720px;margin:auto}
h1{font-size:1.3rem;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.tabs{display:flex;gap:8px}
.tabs button{flex:1}
button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:1rem}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.on{outline:2px solid var(--pri)}
video,canvas{width:100%;border-radius:12px;background:#000}
.wrap{position:relative}
.wrap canvas{position:absolute;inset:0;height:100%}
#hasil{font-size:1.4rem;min-height:2em;padding:8px;border:1px dashed var(--bd);border-radius:10px;margin:8px 0}
textarea{width:100%;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:10px;font-size:1rem}
#player{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center}
#player video{max-height:260px}
.big{font-size:5rem;font-weight:700;color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.box{overflow-x:auto}
small{color:var(--mut)}
.hide{display:none}
</style>
</head>
<body>
<h1>🤟 Isyarat Kita</h1>
<small>Penerjemah bahasa isyarat ⇄ Bahasa Indonesia (versi awal / demo)</small>

<div class="card tabs">
  <button id="t1" class="on">📷 Isyarat → Teks</button>
  <button id="t2" class="alt">⌨️ Teks → Isyarat</button>
</div>

<div id="p1" class="card">
  <div class="wrap"><video id="cam" playsinline muted></video><canvas id="ov"></canvas></div>
  <p><button id="start">Izinkan Kamera & Mulai</button> <button id="clear" class="alt">Hapus</button></p>
  <div id="hasil">—</div>
  <button id="speak1" class="alt">🔊 Bacakan</button> <button id="save1" class="alt">💾 Simpan ke tabel</button>
  <p><small id="status">Kamera belum aktif.</small></p>
</div>

<div id="p2" class="card hide">
  <textarea id="inp" rows="2" placeholder="Ketik kata/kalimat, contoh: halo"></textarea>
  <p><button id="go">▶ Tampilkan Isyarat</button></p>
  <div id="player"><small>Video/gambar isyarat muncul di sini.</small></div>
</div>

<div class="card">
  <b>Tabel Tulisan & Suara</b> <small id="db"></small>
  <div class="box"><table><thead><tr><th>Waktu</th><th>Arah</th><th>Teks</th><th>Suara</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module">
/* ====== KONFIGURASI SUPABASE (isi punya lu) ======
 SQL (jalankan di Supabase > SQL Editor):
 create table riwayat(id bigint generated always as identity primary key, arah text, teks text, created_at timestamptz default now());
 create table kamus(kata text primary key, video_url text);
 alter table riwayat enable row level security; alter table kamus enable row level security;
 create policy "baca" on riwayat for select using(true); create policy "tulis" on riwayat for insert with check(true);
 create policy "baca2" on kamus for select using(true);
 Video: upload ke Storage (bucket publik "isyarat"), nama huruf: a.mp4, b.mp4 ... lalu isi URL dasar di bawah. */
const SUPABASE_URL = "";      // https://xxxx.supabase.co
const SUPABASE_KEY = "";      // anon public key
const VIDEO_BASE   = "";      // https://xxxx.supabase.co/storage/v1/object/public/isyarat

const $ = id => document.getElementById(id);
const sb = (SUPABASE_URL && SUPABASE_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
$("db").textContent = sb ? "(tersambung Supabase)" : "(mode lokal, Supabase belum diisi)";

/* ---------- Tabel & suara ---------- */
function bicara(t){ if(!t||t==="—")return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="id-ID"; speechSynthesis.speak(u); }
async function simpan(arah, teks){
  if(!teks||teks==="—")return;
  if(sb){ await sb.from("riwayat").insert({arah,teks}); }
  else { const l=JSON.parse(localStorage.getItem("riwayat")||"[]"); l.unshift({arah,teks,created_at:new Date().toISOString()}); localStorage.setItem("riwayat",JSON.stringify(l.slice(0,50))); }
  muat();
}
async function muat(){
  let rows=[];
  if(sb){ const r=await sb.from("riwayat").select("*").order("created_at",{ascending:false}).limit(30); rows=r.data||[]; }
  else rows=JSON.parse(localStorage.getItem("riwayat")||"[]");
  $("tb").innerHTML="";
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    const w=new Date(r.created_at).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"});
    [w,r.arah,r.teks].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td);});
    const td=document.createElement("td"),b=document.createElement("button");
    b.textContent="🔊";b.className="alt";b.onclick=()=>bicara(r.teks);td.appendChild(b);tr.appendChild(td);
    $("tb").appendChild(tr);
  });
}
muat();

/* ---------- Tab ---------- */
function tab(n){ $("p1").classList.toggle("hide",n!==1); $("p2").classList.toggle("hide",n!==2);
  $("t1").className=n===1?"on":"alt"; $("t2").className=n===2?"on":"alt"; }
$("t1").onclick=()=>tab(1); $("t2").onclick=()=>tab(2);

/* ---------- Isyarat -> Teks (MediaPipe Hand Landmarker) ---------- */
let teks="", landmarker, jalan=false, last="", cnt=0;
const lm=(h,i)=>h[i];
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function klasifikasi(h){
  // jari menunjuk ke atas: ujung lebih tinggi dari sendi PIP (untuk tangan tegak)
  const up=(t,p)=>h[t].y<h[p].y;
  const idx=up(8,6), mid=up(12,10), rng=up(16,14), pnk=up(20,18);
  const jempol=d(h[4],h[17])>d(h[3],h[17])*1.1; // jempol terbuka menjauhi kelingking
  const n=[idx,mid,rng,pnk].filter(Boolean).length;
  if(idx&&mid&&rng&&pnk&&jempol) return "Halo";
  if(n===4&&!jempol) return "Angka 4";
  if(idx&&mid&&rng&&!pnk) return "Angka 3";
  if(idx&&mid&&!rng&&!pnk) return "Angka 2";
  if(idx&&!mid&&!rng&&!pnk&&jempol) return "L";
  if(idx&&!mid&&!rng&&!pnk) return "Angka 1";
  if(!idx&&!mid&&!rng&&pnk&&jempol) return "Y";
  if(idx&&!mid&&!rng&&pnk&&jempol) return "Aku sayang kamu";
  if(!idx&&!mid&&!rng&&pnk&&!jempol) return "I";
  if(n===0&&jempol) return h[4].y<h[3].y?"Bagus":"A";
  if(n===0) return "Kepal";
  return "";
}
function tampil(){ $("hasil").textContent=teks||"—"; }
async function mulai(){
  $("status").textContent="Memuat model...";
  try{
    const v=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const fs=await v.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker=await v.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},runningMode:"VIDEO",numHands:1});
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480}});
    $("cam").srcObject=s; await $("cam").play(); jalan=true; $("status").textContent="Arahkan tangan ke kamera."; loop();
  }catch(e){ $("status").textContent="Gagal: "+e.message+" (butuh HTTPS & izin kamera)"; }
}
function loop(){
  if(!jalan)return;
  const vid=$("cam"), c=$("ov"); c.width=vid.videoWidth; c.height=vid.videoHeight;
  const g=c.getContext("2d"); g.clearRect(0,0,c.width,c.height);
  const r=landmarker.detectForVideo(vid,performance.now());
  if(r.landmarks&&r.landmarks[0]){
    const h=r.landmarks[0]; g.fillStyle="#22c55e";
    h.forEach(p=>{g.beginPath();g.arc(p.x*c.width,p.y*c.height,4,0,7);g.fill();});
    const k=klasifikasi(h);
    if(k&&k===last){cnt++; if(cnt===15&&teks.split(" ").slice(-1)[0]!==k.split(" ").slice(-1)[0]){teks+=(teks?" ":"")+k;tampil();}}
    else{last=k;cnt=0;}
  }
  requestAnimationFrame(loop);
}
$("start").onclick=mulai;
$("clear").onclick=()=>{teks="";tampil();};
$("speak1").onclick=()=>bicara(teks);
$("save1").onclick=()=>simpan("Isyarat→Teks",teks);

/* ---------- Teks -> Isyarat (video pembelajaran) ---------- */
function kartu(t){ $("player").innerHTML=`<div class="big">${t.toUpperCase()}</div>`; }
function putarVideo(url){
  return new Promise(res=>{
    if(!url) return res(false);
    const v=document.createElement("video"); v.src=url; v.autoplay=true; v.muted=true; v.playsInline=true; v.controls=true;
    v.onended=()=>res(true); v.onerror=()=>res(false);
    $("player").innerHTML=""; $("player").appendChild(v); v.play().catch(()=>res(false));
  });
}
async function isyarat(){
  const t=$("inp").value.trim().toLowerCase(); if(!t)return;
  simpan("Teks→Isyarat",t);
  for(const kata of t.split(/\s+/)){
    let ok=false;
    if(sb){ const r=await sb.from("kamus").select("video_url").eq("kata",kata).maybeSingle(); if(r.data) ok=await putarVideo(r.data.video_url); }
    if(ok) continue;
    for(const huruf of kata.replace(/[^a-z0-9]/g,"")){   // eja per huruf
      const ok2=VIDEO_BASE?await putarVideo(`${VIDEO_BASE}/${huruf}.mp4`):false;
      if(!ok2){ kartu(huruf); await new Promise(r=>setTimeout(r,900)); }
    }
  }
  $("player").innerHTML="<small>Selesai ✔</small>";
}
$("go").onclick=isyarat;
</script>
</body>
</html>
